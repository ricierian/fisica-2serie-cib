<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Física 2ª Série CIB</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#23395B">
<meta name="description" content="Listas interativas de Física da 2ª série do Colégio Israelita Brasileiro, com dica e resolução passo a passo.">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Física 2ª">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
--bg:#EDF0F3; --surface:#FFFFFF; --ink:#141B22; --muted:#55616D; --line:#D2D9E0;
--sign:#1D4E89; --sign-ink:#FFFFFF; --lane:#F2B705; --road:#2A3037; --road-ink:#F3F5F7;
--ok:#1B7A45; --ok-bg:#E2F2E8; --bad:#B23A25; --bad-bg:#FAE8E3;
--tip-bg:#FFF5D6; --tip-ink:#5E4500; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#F3F5F8;
--f-display:'Barlow Condensed','Arial Narrow',sans-serif;
--f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
--f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--bg:#0F141A; --surface:#17202A; --ink:#E6ECF2; --muted:#98A5B2; --line:#2A3542;
--sign:#2C63A8; --sign-ink:#FFFFFF; --lane:#F2C230; --road:#0A0E12; --road-ink:#F3F5F7;
--ok:#5CCB8D; --ok-bg:#15301F; --bad:#F28C74; --bad-bg:#3A1C16;
--tip-bg:#2D2610; --tip-ink:#F2D27A; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#111922; color-scheme:dark;
}
}
:root[data-theme="dark"]{
--bg:#0F141A; --surface:#17202A; --ink:#E6ECF2; --muted:#98A5B2; --line:#2A3542;
--sign:#2C63A8; --sign-ink:#FFFFFF; --lane:#F2C230; --road:#0A0E12; --road-ink:#F3F5F7;
--ok:#5CCB8D; --ok-bg:#15301F; --bad:#F28C74; --bad-bg:#3A1C16;
--tip-bg:#2D2610; --tip-ink:#F2D27A; --mark-ok:#2FA463; --mark-bad:#D9553B;
--eq-bg:#111922; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.plate{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:6px}
.plate-inner{border:2px solid var(--sign-ink);border-radius:8px;padding:14px 18px 16px;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.plate h1{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,9vw,52px);line-height:1;margin:6px 0 0;letter-spacing:.01em;text-wrap:balance}
.plate p{margin:4px 0 0;font-size:17px;opacity:.95}
.road{background:var(--road);color:var(--road-ink);border-radius:10px;padding:10px 10px 12px;position:relative;overflow:hidden}
.road-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.lane{position:relative;height:26px}
.lane::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--lane) 0 14px,transparent 14px 26px);opacity:.9}
.car{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .5s ease;width:34px;height:20px}
.marks{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.mk{height:32px;border-radius:5px;border:1.5px solid rgba(243,245,247,.35);background:transparent;color:var(--road-ink);font-family:var(--f-mono);font-size:13px;font-weight:600;padding:0;min-width:0}
.mk.ok{background:var(--mark-ok);border-color:var(--mark-ok)}
.mk.bad{background:var(--mark-bad);border-color:var(--mark-bad)}
.mk.cur{outline:2.5px solid var(--lane);outline-offset:1px}
.tools{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tools summary{padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.tools summary::-webkit-details-marker{display:none}
.tools summary .chev{font-family:var(--f-mono);color:var(--muted);transition:transform .2s}
.tools[open] summary .chev{transform:rotate(90deg)}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;padding:0 18px 18px}
.tool{background:var(--eq-bg);border-radius:8px;padding:12px 14px;min-width:0}
.tool h4{margin:0 0 6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tool div{font-size:16px;line-height:1.9}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.qnum span{color:var(--muted);font-weight:600}
.src{font-family:var(--f-mono);font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.stmt{margin:0;font-size:18px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--sign)}
.opt:disabled{cursor:default}
.letter{flex:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--eq-bg);color:var(--ink)}
.opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-correct .letter{background:var(--ok);color:var(--surface)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .letter{background:var(--bad);color:var(--surface)}
.opt.is-dim{opacity:.55}
.opt .tag{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.opt.is-correct .tag{color:var(--ok)}
.opt.is-wrong .tag{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border-radius:9px;padding:11px 18px;font-weight:700;border:1.5px solid var(--line);background:var(--surface)}
.btn:hover{border-color:var(--sign)}
.btn.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px;text-decoration:underline;text-underline-offset:3px}
.spacer{flex:1}
.tip{background:var(--tip-bg);color:var(--tip-ink);border-radius:10px;padding:12px 16px;font-size:16px}
.tip b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.feedback{border-radius:10px;padding:12px 16px;font-weight:700;display:flex;gap:10px;align-items:center}
.feedback.good{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.feedback .ico{font-family:var(--f-mono);font-size:18px}
.sol{border-top:2px dashed var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sol h3{font-family:var(--f-display);font-size:28px;margin:0;line-height:1}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;counter-increment:st;min-width:0}
.step::before{content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px}
.step-body{min-width:0}
.step-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:4px 0 4px}
.step-body p{margin:0 0 8px}
.step-body p:last-child{margin-bottom:0}
.step-body ul{margin:0;padding-left:20px}
.eq{background:var(--eq-bg);border-radius:8px;padding:10px 14px;margin:8px 0;overflow-x:auto;white-space:nowrap;font-size:17px;line-height:2.3;font-variant-numeric:tabular-nums}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em 1px}
.frac>span:last-child{padding:2px .3em 0}
.hl{background:var(--tip-bg);color:var(--tip-ink);padding:0 .25em;border-radius:3px;font-weight:700}
.answer{display:flex;align-items:center;gap:12px;background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:12px 16px;font-weight:700}
.answer .letter{background:var(--ok);color:var(--surface)}
.alt{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;font-size:16px}
.alt b.lbl,.warn b.lbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px}
.alt b.lbl{color:var(--sign)}
.warn{background:var(--bad-bg);border-radius:10px;padding:12px 16px;font-size:16px}
.warn b.lbl{color:var(--bad)}
.tblwrap{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--eq-bg);font-weight:700}
td.meet{background:var(--ok-bg);color:var(--ok);font-weight:700}
.intro p{margin:0}
.intro ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.score{font-family:var(--f-display);font-size:72px;line-height:.9;font-weight:700}
.score span{color:var(--muted);font-size:40px}
.reslist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.res{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--surface);text-align:left}
.res:hover{border-color:var(--sign)}
.res .st{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:13px}
.res.ok .st{color:var(--ok)} .res.bad .st{color:var(--bad)} .res.none .st{color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
@media (max-width:480px){
body{font-size:16px}
.card{padding:18px 16px}
.stmt{font-size:17px}
.mk{font-size:11.5px;height:30px}
.marks{gap:3px}
}
@media (prefers-reduced-motion: reduce){ .car,.tools summary .chev{transition:none} }
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.crumbs button{background:none;border:0;padding:4px 2px;color:var(--sign);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.crumbs .sep{opacity:.6}
.crumbs .here{color:var(--ink);font-weight:600}
.sect-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.cards{display:flex;flex-direction:column;gap:12px}
.tile{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--sign)}
.tile:active{transform:scale(.99)}
.tile .ico{width:52px;height:52px;border-radius:10px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;border:2px solid var(--sign-ink);outline:3px solid var(--sign)}
.tile .ico.lane{background:var(--road);color:var(--lane);outline-color:var(--road);border-color:var(--lane);font-family:var(--f-mono);font-size:16px}
.tile .tt{display:block;margin:0;font-family:var(--f-display);font-size:24px;line-height:1.05}
.tile .ds{display:block;margin:4px 0 0;font-size:15px;color:var(--muted);line-height:1.4}
.tile .go{font-family:var(--f-mono);font-weight:600;color:var(--sign);font-size:20px}
.tile .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.note{font-size:14.5px;color:var(--muted);margin:0}
@media (max-width:480px){.tile{grid-template-columns:44px 1fr auto;padding:14px}.tile .ico{width:44px;height:44px;font-size:20px}.tile .tt{display:block;font-size:21px}}
:root{--lvi-bg:#E1EAF6;--lvi-ink:#1D4E89;--lva-bg:#2A3037;--lva-ink:#F2B705;--plot2:#B4540A;--lvb-line:#F2B705;--lvi-line:#8DB6EA;--lva-line:#F3F5F7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lvi-bg:#1A2B44;--lvi-ink:#9CC0EE;--lva-bg:#0A0E12;--lva-ink:#F2C230;--plot2:#F2A65A}}
:root[data-theme="dark"]{--lvi-bg:#1A2B44;--lvi-ink:#9CC0EE;--lva-bg:#0A0E12;--lva-ink:#F2C230;--plot2:#F2A65A}
.lvl{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.lvl-b{background:var(--tip-bg);color:var(--tip-ink)}
.lvl-i{background:var(--lvi-bg);color:var(--lvi-ink)}
.lvl-a{background:var(--lva-bg);color:var(--lva-ink);box-shadow:inset 0 0 0 1px var(--lva-ink)}
.lvrow{display:grid;gap:4px;margin-top:6px}
.lvrow span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding-top:4px;border-top:2px solid;color:var(--road-ink);opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-b{border-color:var(--lvb-line)}.lv-i{border-color:var(--lvi-line)}.lv-a{border-color:var(--lva-line)}
.stmt{display:flex;flex-direction:column;gap:12px}
.fig{margin:4px 0 0;background:var(--eq-bg);border-radius:10px;padding:10px 8px 6px;max-width:400px;width:100%}
.plot{display:block;width:100%;height:auto}
.plot .pt{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.plot .pt-strong{fill:var(--ink);font-weight:600}
.plot .pt-lab{font-size:14px;font-weight:600}
.plot .pt-car{fill:#FFFFFF;font-size:12px;font-weight:600}
.step-body .fig{margin:8px 0}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.fld input,.fld select{font:inherit;font-weight:400;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.fld input:focus,.fld select:focus{outline:3px solid var(--lane);outline-offset:1px;border-color:var(--sign)}
#loginErro{color:var(--bad);min-height:1em;margin:0}
.fld-dica{font-weight:400;color:var(--muted);font-size:13.5px}
.emailbox{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.emailbox:focus-within{outline:3px solid var(--lane);outline-offset:1px;border-color:var(--sign)}
.fld .emailbox input{border:0;border-radius:0;outline:none}
.fld .emailbox input:focus{outline:none}
.emailbox .dom{font-size:14px;font-weight:700;color:var(--muted);background:var(--eq-bg);padding:9px 14px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.note b{overflow-wrap:anywhere}
/* ===== 2ª série CIB: identidade por tema ===== */
:root{--sign:#23395B;--ray:#B85C00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sign:#3A5A8C;--ray:#FFC24A}}
:root[data-theme="dark"]{--sign:#3A5A8C;--ray:#FFC24A}
.th-ondas, :root.th-ondas{--sign:#0B6477;--lane:#FF9466;--road:#0B2830;--road-ink:#EAF5F7;--lvb-line:#FF9466}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-ondas, :root:not([data-theme="light"]) .th-ondas{--sign:#137C91;--lane:#FFA27A;--road:#06191E}}
:root[data-theme="dark"].th-ondas, :root[data-theme="dark"] .th-ondas{--sign:#137C91;--lane:#FFA27A;--road:#06191E}
.th-optica, :root.th-optica{--sign:#4A3A8C;--lane:#FFCF4D;--road:#171230;--road-ink:#F1EEFA;--lvb-line:#FFCF4D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]).th-optica, :root:not([data-theme="light"]) .th-optica{--sign:#5D4BAE;--lane:#FFD666;--road:#0D0A1E}}
:root[data-theme="dark"].th-optica, :root[data-theme="dark"] .th-optica{--sign:#5D4BAE;--lane:#FFD666;--road:#0D0A1E}
.plate{position:relative;overflow:hidden}
.plate-inner{position:relative;z-index:1}
.plate-deco{position:absolute;right:10px;bottom:8px;width:min(44%,220px);color:var(--sign-ink);opacity:.32;pointer-events:none}
.plate-deco svg{display:block;width:100%;height:auto}
.th-optica .plate-deco{opacity:.55}
/* Trilhas de progresso: onda numa corda e raio de luz */
.lane2{position:relative;height:30px;margin:0 6px 0 22px;--p:0}
.lane2 svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lane2 .ln-base line{stroke:var(--road-ink);stroke-width:2;opacity:.3;vector-effect:non-scaling-stroke}
.ln-raio .ln-base line{stroke-dasharray:4 6}
.lane2 .ln-fill{clip-path:inset(0 100% 0 0);transition:clip-path .6s ease}
.ln-onda .ln-fill path{fill:none;stroke:var(--lane);stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ln-raio .ln-fill line{stroke:var(--lane);stroke-width:4;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px var(--lane))}
.ln-head{position:absolute;top:50%;left:calc(var(--p) * 1%);transition:left .6s ease}
.ln-onda .ln-head{width:12px;height:12px;border-radius:50%;background:var(--lane);transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.ln-raio .ln-head{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid var(--lane);transform:translate(-30%,-50%)}
.ln-src{position:absolute;left:-18px;top:50%;transform:translateY(-50%)}
.ln-onda .ln-src{width:4px;height:24px;border-radius:2px;background:var(--road-ink);opacity:.7}
.ln-raio .ln-src{width:12px;height:12px;border-radius:50%;background:var(--lane);box-shadow:0 0 8px 2px var(--lane)}
@media (prefers-reduced-motion: reduce){.lane2 .ln-fill,.ln-head{transition:none}}
/* Revisão do professor */
.mod{border:1.5px dashed var(--muted);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--muted)}
.mod b{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px;color:var(--ink)}
.tbl-txt td,.tbl-txt th{white-space:normal}
.tbl-txt table{min-width:0;width:100%}
.tbl-esq td:last-child{text-align:left}
.tbl-esq td{vertical-align:top}
@media (max-width:480px){.tbl-txt table{font-size:13.5px}.tbl-txt td,.tbl-txt th{padding:6px 7px}}

<body>
<div class="wrap">
<header class="plate"><div class="plate-deco" id="deco" aria-hidden="true"></div><div class="plate-inner"><div class="eyebrow" id="eyebrow"></div><h1 id="ptitle"></h1><p id="psub"></p></div></header>
<nav class="crumbs" id="crumbs" aria-label="Você está em" hidden></nav>
<main id="view" style="display:flex;flex-direction:column;gap:18px"></main>
</div>
<script>
/* ===== Ajudantes usados em todas as listas ===== */
const f = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const L = ['A','B','C','D','E'];
const nf = v => String(v).replace('.', ',');
let _uid = 0;

/* Figura SVG genérica (segue o tema claro/escuro). vb = "0 0 L A" */
const fig = (vb, aria, inner, w) => `<figure class="fig"${w ? ` style="max-width:${w}px"` : ''}><svg viewBox="${vb}" class="plot" role="img" aria-label="${aria}">${inner}</svg></figure>`;
/* Ponta de seta: devolve [defs, url] com id único */
function seta(cor){ const id = 'sa' + (++_uid); return [`<defs><marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="${cor}"/></marker></defs>`, `url(#${id})`]; }

/* Pontos de uma senoide: y = A·sen(2π(x − x0)/λ + fase) */
function sen(A, lam, xa, xb, fase, n){ n = n || 120; fase = fase || 0; const p = []; for (let k = 0; k <= n; k++){ const x = xa + (xb - xa) * k / n; p.push([+x.toFixed(4), +(A * Math.sin(2 * Math.PI * x / lam + fase)).toFixed(4)]); } return p; }

/* Gráfico cartesiano. o = {aria, xmin, xmax, ymin, ymax, xt, yt, xl, yl, L:[{p, c, dash, w, lab, lp}], pts, ann:[[x,y,txt,anchor,cor]], dims:[[x1,y1,x2,y2,txt,dx,dy]], H, W} */
function plot(o){
  const W = o.W || 340, H = o.H || 236, l = o.l || 46, r = 18, t = 28, b = 40;
  const x0 = o.xmin || 0, y0 = o.ymin || 0;
  const sx = x => +(l + (x - x0) / (o.xmax - x0) * (W - l - r)).toFixed(1);
  const sy = y => +(H - b - (y - y0) / (o.ymax - y0) * (H - t - b)).toFixed(1);
  const [defs, mk] = seta('var(--ink)');
  let s = `<svg viewBox="0 0 ${W} ${H}" class="plot" role="img" aria-label="${o.aria}">${defs}`;
  (o.xt || []).forEach(x => { s += `<line x1="${sx(x)}" y1="${sy(y0)}" x2="${sx(x)}" y2="${sy(o.ymax)}" stroke="var(--line)"/>`; if (!o.noxl) s += `<text x="${sx(x)}" y="${sy(y0)+16}" text-anchor="middle" class="pt">${nf(x)}</text>`; });
  (o.yt || []).forEach(y => { s += `<line x1="${sx(x0)}" y1="${sy(y)}" x2="${sx(o.xmax)}" y2="${sy(y)}" stroke="var(--line)"/><text x="${sx(x0)-7}" y="${sy(y)+4}" text-anchor="end" class="pt">${nf(y)}</text>`; });
  const yax = (y0 < 0 && o.ymax > 0) ? 0 : y0;
  s += `<line x1="${sx(x0)}" y1="${sy(yax)}" x2="${sx(o.xmax)}" y2="${sy(yax)}" stroke="var(--muted)" stroke-width="1.5"/><line x1="${sx(x0)}" y1="${sy(y0)}" x2="${sx(x0)}" y2="${sy(o.ymax)}" stroke="var(--muted)" stroke-width="1.5"/>`;
  s += `<text x="${W-r}" y="${H-6}" text-anchor="end" class="pt">${o.xl}</text><text x="${sx(x0)}" y="16" text-anchor="middle" class="pt">${o.yl}</text>`;
  o.L.forEach(ln => {
    s += `<polyline points="${ln.p.map(([x,y]) => sx(x)+','+sy(y)).join(' ')}" fill="none" stroke="${ln.c}" stroke-width="${ln.w || 3}" stroke-linecap="round" stroke-linejoin="round"${ln.dash ? ` stroke-dasharray="${ln.dash}"` : ''}/>`;
    if (ln.lab){ const [x, y] = ln.lp || ln.p[ln.p.length-1]; s += `<text x="${sx(x)}" y="${sy(y)}" class="pt pt-lab" fill="${ln.c}">${ln.lab}</text>`; }
  });
  (o.dims || []).forEach(([xa, ya, xb, yb, txt, dx, dy]) => {
    s += `<line x1="${sx(xa)}" y1="${sy(ya)}" x2="${sx(xb)}" y2="${sy(yb)}" stroke="var(--ink)" stroke-width="1.4" marker-start="${mk}" marker-end="${mk}"/>`;
    if (txt) s += `<text x="${(sx(xa)+sx(xb))/2 + (dx||0)}" y="${(sy(ya)+sy(yb))/2 + (dy||-6)}" text-anchor="middle" class="pt pt-strong">${txt}</text>`;
  });
  (o.pts || []).forEach(([x, y]) => { s += `<circle cx="${sx(x)}" cy="${sy(y)}" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`; });
  (o.ann || []).forEach(([x, y, txt, a, c]) => { s += `<text x="${sx(x)}" y="${sy(y)}" text-anchor="${a || 'middle'}" class="pt pt-strong"${c ? ` fill="${c}"` : ''}>${txt}</text>`; });
  return `<figure class="fig">${s}</svg></figure>`;
}

/* Tabela simples: cab = [..], linhas = [[..],[..]] */
const tabela = (cab, linhas, esq) => `<div class="tblwrap tbl-txt${esq ? ' tbl-esq' : ''}"><table>${cab ? `<tr>${cab.map(c => `<th>${c}</th>`).join('')}</tr>` : ''}${linhas.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

/* ===== Lista 1 · Ondulatória: conceitos iniciais e equação fundamental ===== */
const TOOLS1 = [
  ['Frequência e período', `f = ${f('n.º de oscilações','tempo')}<br>T = ${f('tempo','n.º de oscilações')} &nbsp; T = ${f('1','f')}`],
  ['Equação fundamental', `v = λ · f &nbsp;&nbsp; ou &nbsp;&nbsp; v = ${f('λ','T')}`],
  ['Elementos da onda', `Amplitude (A): do equilíbrio até a crista<br>Comprimento de onda (λ): de uma crista à seguinte`],
  ['Classificação', `Mecânica: precisa de meio material<br>Eletromagnética: não precisa de meio<br>Transversal: vibra ⊥ à propagação<br>Longitudinal: vibra ∥ à propagação`],
  ['Mudança de meio', `A frequência não muda (é a da fonte).<br>v e λ mudam na mesma proporção.`],
  ['Unidades', `1 Hz = 1 oscilação por segundo<br>1 cm = 0,01 m · 1 kHz = 1 000 Hz<br>km/h ÷ 3,6 → m/s`],
];

/* Q1: lago com boia */
const FIG1_1 = (() => {
  const pts = []; for (let x = 10; x <= 330; x += 4) pts.push([x, +(72 + 13 * Math.sin(2 * Math.PI * (x - 10) / 110)).toFixed(1)]);
  const yb = +(72 + 13 * Math.sin(2 * Math.PI * (178 - 10) / 110)).toFixed(1);
  const [d, mk] = seta('var(--ink)');
  return fig('0 0 340 150', 'Corte de um lago: a superfície da água forma ondas que se propagam para a direita; uma pequena boia flutua no ponto P.',
    `${d}<path d="M${pts.map(p => p.join(' ')).join(' L')} L330 140 L10 140 Z" fill="var(--sign)" opacity=".16"/>
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--sign)" stroke-width="3"/>
    <circle cx="178" cy="${yb - 7}" r="8" fill="var(--plot2)" stroke="var(--ink)" stroke-width="1.5"/>
    <text x="178" y="${yb - 22}" text-anchor="middle" class="pt pt-strong">P</text>
    <line x1="232" y1="24" x2="312" y2="24" stroke="var(--ink)" stroke-width="2" marker-end="${mk}"/>
    <text x="272" y="16" text-anchor="middle" class="pt">propagação</text>`);
})();

/* Q5: ola no estádio */
const FIG1_5 = (() => {
  let s = ''; const base = 118, n = 31, dx = 10, x0 = 20;
  for (let i = 0; i < n; i++){
    const x = x0 + i * dx, c = Math.cos(2 * Math.PI * (i - 3) / 25), up = c > 0 ? Math.pow(c, 3) : 0;
    const top = base - 22 - 26 * up;
    s += `<line x1="${x}" y1="${base}" x2="${x}" y2="${top.toFixed(1)}" stroke="var(--muted)" stroke-width="2"/><circle cx="${x}" cy="${(top - 4).toFixed(1)}" r="4" fill="var(--sign)"/>`;
  }
  const [d, mk] = seta('var(--ink)');
  return fig('0 0 340 170', 'Fileira de torcedores: os que estão na crista da ola estão de pé, os demais sentados. Entre duas cristas seguidas há 25 intervalos entre torcedores; a distância entre dois torcedores vizinhos é 80 centímetros.',
    `${d}${s}<line x1="12" y1="${base}" x2="328" y2="${base}" stroke="var(--line)" stroke-width="2"/>
    <line x1="${x0 + 3*dx}" y1="34" x2="${x0 + 28*dx}" y2="34" stroke="var(--ink)" stroke-width="1.4" marker-start="${mk}" marker-end="${mk}"/>
    <text x="${x0 + 15.5*dx}" y="26" text-anchor="middle" class="pt pt-strong">λ (25 intervalos)</text>
    <line x1="${x0 + 14*dx}" y1="${base + 14}" x2="${x0 + 15*dx}" y2="${base + 14}" stroke="var(--ink)" stroke-width="1.2"/>
    <line x1="${x0 + 14*dx}" y1="${base + 9}" x2="${x0 + 14*dx}" y2="${base + 19}" stroke="var(--ink)"/><line x1="${x0 + 15*dx}" y1="${base + 9}" x2="${x0 + 15*dx}" y2="${base + 19}" stroke="var(--ink)"/>
    <text x="${x0 + 14.5*dx}" y="${base + 34}" text-anchor="middle" class="pt pt-strong">80 cm</text>`);
})();

/* Q10: tanque visto de cima */
const FIG1_10 = (() => {
  const [d, mk] = seta('var(--ink)'); let s = '';
  [16, 38, 60, 82, 104].forEach(r => { s += `<circle cx="150" cy="122" r="${r}" fill="none" stroke="var(--sign)" stroke-width="2.5"/>`; });
  return fig('0 0 340 244', 'Vista de cima de um tanque: cinco cristas circulares concêntricas em torno do ponto onde a gota cai. A distância entre a crista mais interna e a mais externa, ao longo de um raio, é 12 centímetros.',
    `${d}<rect x="34" y="8" width="232" height="228" rx="10" fill="var(--sign)" opacity=".08"/>${s}
    <circle cx="150" cy="122" r="3.5" fill="var(--ink)"/>
    <line x1="166" y1="122" x2="254" y2="122" stroke="var(--ink)" stroke-width="1.4" marker-start="${mk}" marker-end="${mk}"/>
    <rect x="186" y="104" width="48" height="16" rx="3" fill="var(--eq-bg)"/><text x="210" y="116" text-anchor="middle" class="pt pt-strong">12 cm</text>
    <text x="276" y="40" class="pt">5 cristas</text>`, 300);
})();

const QL1 = [
{
  src:'Inédita', nivel:'básico',
  text:`Uma onda se propaga para a direita na superfície de um lago, como mostra a figura. Uma pequena boia flutua no ponto P.${FIG1_1}Enquanto as ondas passam por ela, a boia:`,
  opts:['é arrastada para a direita, acompanhando a crista da onda','oscila, mas não é levada pela onda','fica parada, pois a onda passa por baixo dela','é arrastada para a esquerda, no sentido contrário ao da onda','afunda, pois a onda empurra a água para baixo'], ans:1,
  hint:'O que uma onda transporta de um lugar para outro: matéria ou energia?',
  steps:[
    ['O que a onda transporta', `<p>Uma onda transporta <b>energia</b> de um ponto a outro, mas <b>não transporta matéria</b>. A água (e o que flutua nela) só oscila em torno de onde já estava.</p>`],
    ['O movimento da boia', `<p>Quando a crista chega, a boia sobe; quando chega o vale, ela desce. Depois que a onda passa, ela está praticamente no mesmo lugar.</p><p>(Na água, as partículas fazem um pequeno vaivém em torno da posição de equilíbrio, mas não acompanham a onda.)</p>`],
  ],
  alt:'Pense na “ola” do estádio: a onda dá a volta na arquibancada, mas cada torcedor só levanta e senta no próprio lugar.',
  warn:'A crista parece “andar” para a direita, e é fácil achar que a boia vai junto (alternativa a). O que se desloca é a perturbação, não a água.',
  mod:'Inédita (mesma ideia da questão do Albert Einstein da Somativa 1: a onda não transporta matéria), com outro contexto e figura nova.'
},
{
  src:'EEAR (modificada)', nivel:'básico',
  text:`Um aluno montou a tabela abaixo para classificar algumas ondas quanto à natureza e à direção de vibração.${tabela(['Onda','Natureza','Vibração'],[['I. Som no ar','mecânica','longitudinal'],['II. Luz do Sol','eletromagnética','transversal'],['III. Onda numa corda de violão','mecânica','transversal'],['IV. Micro-ondas','mecânica','transversal']])}Estão corretas as linhas:`,
  opts:['Apenas I e II','Apenas II e III','Apenas I, II e III','Apenas II, III e IV','I, II, III e IV'], ans:2,
  hint:'Micro-ondas fazem parte do mesmo “grupo” que a luz. E o som: a vibração do ar vai e volta na mesma direção em que o som avança?',
  steps:[
    ['Linha I: som no ar', `<p>O som precisa de um meio (ar, água, sólidos): é <b>mecânico</b>. As camadas de ar vão e voltam na mesma direção em que o som avança: é <b>longitudinal</b>. ✓</p>`],
    ['Linhas II e III', `<p>A luz é <b>eletromagnética</b> e <b>transversal</b> (os campos elétrico e magnético oscilam perpendicularmente à propagação). ✓</p><p>Numa corda de violão, a corda vibra para os lados enquanto a onda corre ao longo dela: <b>mecânica e transversal</b>. ✓</p>`],
    ['Linha IV: micro-ondas', `<p>Micro-ondas são ondas <b>eletromagnéticas</b>, como a luz, e se propagam até no vácuo (é assim que os satélites se comunicam). Por isso a linha IV está errada.</p>`],
  ],
  alt:'Teste rápido para a natureza: “essa onda chega até nós vinda do espaço?”. Se sim (luz, micro-ondas, raios X), é eletromagnética. O som não atravessa o vácuo.',
  warn:'O forno de micro-ondas faz a comida vibrar e esquentar, mas isso não torna a micro-onda uma onda mecânica.',
  mod:'Original (EEAR): quatro afirmações em texto sobre ondas mecânicas, eletromagnéticas e longitudinais. Modificada: virou uma tabela de classificação com outros exemplos.'
},
{
  src:'UEA (modificada)', nivel:'básico',
  text:'Durante uma pescaria, um pescador percebe que seu barco, atingido por ondas iguais e igualmente espaçadas, sobe e desce 12 vezes em 30 segundos. A frequência e o período dessas ondas são, respectivamente:',
  opts:['2,5 Hz e 0,4 s','12 Hz e 30 s','0,4 Hz e 0,4 s','2,5 Hz e 2,5 s','0,4 Hz e 2,5 s'], ans:4,
  hint:'Frequência é quantas oscilações acontecem por segundo. Período é quanto tempo dura uma oscilação.',
  steps:[
    ['Dados', `<ul><li>12 oscilações</li><li>em 30 s</li></ul>`],
    ['Frequência', `<div class="eq">f = ${f('n.º de oscilações','tempo')} = ${f('12','30 s')} = <span class="hl">0,4 Hz</span></div>`],
    ['Período', `<div class="eq">T = ${f('tempo','n.º de oscilações')} = ${f('30 s','12')} = <span class="hl">2,5 s</span></div><p>Conferindo: T = ${f('1','f')} = ${f('1','0,4')} = 2,5 s ✓</p>`],
  ],
  alt:'Faz sentido? Se o barco sobe e desce 12 vezes em 30 s, cada oscilação leva um pouco mais de 2 s. Um período de 0,4 s seria um balanço frenético, mais de 2 por segundo.',
  warn:'Inverter a divisão (30 ÷ 12 para a frequência) leva à alternativa a. Frequência é sempre “quantas por segundo”: oscilações em cima, tempo embaixo.',
  mod:'Original (UEA, Somativa 1): 14 oscilações em 20 s, pedia só a frequência. Modificada: 12 oscilações em 30 s e pede frequência e período.'
},
{
  src:'Inédita', nivel:'intermediário',
  text:`A figura representa, num certo instante, o formato de uma corda por onde passa uma onda com velocidade de 24 m/s.${plot({aria:'Gráfico da corda: posição vertical y em centímetros por posição x em centímetros. Senoide com cristas em y igual a 3 centímetros nas posições x igual a 3 e 15 e 27 centímetros, e vales em y igual a menos 3 centímetros.', xmin:0, xmax:30, ymin:-4, ymax:4, xt:[0,3,6,9,12,15,18,21,24,27,30], yt:[-3,0,3], xl:'x (cm)', yl:'y (cm)', L:[{p:sen(3,12,0,30), c:'var(--sign)'}]})}A amplitude, o comprimento de onda e a frequência dessa onda são, respectivamente:`,
  opts:['6 cm, 12 cm e 200 Hz','3 cm, 12 cm e 2 Hz','3 cm, 6 cm e 400 Hz','3 cm, 12 cm e 200 Hz','6 cm, 24 cm e 100 Hz'], ans:3,
  hint:'A amplitude se mede a partir da linha de equilíbrio (y = 0). Para a frequência, passe λ para metros antes de usar v = λ · f.',
  steps:[
    ['Lendo o gráfico', `<ul><li>Amplitude: do equilíbrio (y = 0) até a crista (y = 3 cm) → <b>A = 3 cm</b></li><li>Cristas seguidas em x = 3 cm e x = 15 cm → <b>λ = 12 cm = 0,12 m</b></li></ul>`],
    ['Frequência', `<div class="eq">v = λ · f &nbsp;⇒&nbsp; f = ${f('v','λ')} = ${f('24 m/s','0,12 m')} = <span class="hl">200 Hz</span></div>`],
  ],
  alt:'Em 1 s a onda anda 24 m = 2 400 cm. Quantos comprimentos de onda de 12 cm cabem em 2 400 cm? 2 400 ÷ 12 = 200. São 200 oscilações por segundo.',
  warn:'Da crista ao vale são 6 cm, mas isso é o dobro da amplitude (alternativa a). E dividir 24 por 12 sem converter cm para m dá 2 Hz (alternativa b).',
  mod:'Inédita, no formato do exercício 8 da lista de Ondulatória da apostila (gráfico + v = λ·f), com outros valores.'
},
{
  src:'Enem (modificada)', nivel:'intermediário',
  text:`Uma manifestação comum das torcidas em estádios de futebol é a <i>ola</i>. Os torcedores de uma linha, sem sair do lugar, levantam e sentam sincronizados com os da linha vizinha, e o efeito se propaga pela arquibancada como uma onda.${FIG1_5}Suponha que essa “onda humana” se propague a 36 km/h e que, entre duas cristas seguidas, haja 25 intervalos entre torcedores, cada um de 80 cm. A frequência dessa onda, em hertz, é:`,
  opts:['1,8','0,5','2,0','0,4','1,4'], ans:1,
  hint:'Monte o comprimento de onda a partir dos torcedores (em metros) e passe a velocidade para m/s.',
  steps:[
    ['Comprimento de onda', `<div class="eq">λ = 25 × 0,80 m = 20 m</div>`],
    ['Velocidade em m/s', `<div class="eq">v = 36 km/h ÷ 3,6 = 10 m/s</div>`],
    ['Frequência', `<div class="eq">f = ${f('v','λ')} = ${f('10 m/s','20 m')} = <span class="hl">0,5 Hz</span></div><p>Cada torcedor levanta e senta uma vez a cada 2 s, o que é bem realista.</p>`],
  ],
  alt:'A crista anda 10 m por segundo e precisa andar 20 m para que a próxima crista chegue ao mesmo torcedor. Isso leva 2 s (o período). Então f = 1/2 = 0,5 Hz.',
  warn:'Usar 36 direto (sem converter km/h) dá 36 ÷ 20 = 1,8 (alternativa a). E inverter a fórmula (λ ÷ v) dá 2,0, que é o período, não a frequência.',
  mod:'Original (Enem): 45 km/h, 16 pessoas por período, 80 cm entre elas; resposta ≈ 1,0 Hz. Modificada: 36 km/h e 25 intervalos de 80 cm; resposta 0,5 Hz.'
},
{
  src:'PUCRS (modificada)', nivel:'intermediário',
  text:'Um estudante está num barco ancorado num lago. Uma brisa leve forma pequenas ondas que fazem oscilar uma folha flutuando perto do barco. Ele estima que a distância entre duas cristas sucessivas é de 1,5 m e que passam pela folha 24 cristas por minuto. A frequência e a velocidade de propagação dessas ondas são, respectivamente:',
  opts:['24 Hz e 36 m/s','0,4 Hz e 3,75 m/s','2,5 Hz e 3,75 m/s','0,4 Hz e 1,5 m/s','0,4 Hz e 0,6 m/s'], ans:4,
  hint:'“Por minuto” não é hertz. Quantas cristas passam por segundo?',
  steps:[
    ['Dados', `<ul><li>λ = 1,5 m (distância entre cristas sucessivas)</li><li>24 cristas por minuto</li></ul>`],
    ['Frequência em Hz', `<div class="eq">f = ${f('24','60 s')} = <span class="hl">0,4 Hz</span></div>`],
    ['Velocidade', `<div class="eq">v = λ · f = 1,5 × 0,4 = <span class="hl">0,6 m/s</span></div>`],
  ],
  alt:`Pelo período: T = ${f('60 s','24')} = 2,5 s. A crista anda um λ (1,5 m) em um período: v = ${f('1,5 m','2,5 s')} = 0,6 m/s.`,
  warn:'2,5 s é o período, não a frequência (alternativa c). E dividir λ pela frequência (1,5 ÷ 0,4 = 3,75) é usar a fórmula de trás para frente (alternativa b).',
  mod:'Original (PUCRS): cristas a 40 cm e 30 cristas por minuto. Modificada: 1,5 m e 24 cristas por minuto.'
},
{
  src:'Inédita', nivel:'intermediário',
  text:`Um alto-falante na borda de uma piscina emite um som de 500 Hz. Parte desse som passa do ar para a água. Use a tabela.${tabela(['Meio','Velocidade do som'],[['Ar (20 °C)','340 m/s'],['Água','1 450 m/s']])}Na água, a frequência e o comprimento de onda desse som são, aproximadamente:`,
  opts:['500 Hz e 0,68 m','2 132 Hz e 0,68 m','500 Hz e 0,34 m','500 Hz e 2,9 m','117 Hz e 2,9 m'], ans:3,
  hint:'Quem define a frequência é a fonte. Quando a onda muda de meio, o que muda é a velocidade e, com ela, o comprimento de onda.',

/* Q4: campo visual (malha) */
function campo(sol){
  const u = 28, ox = 132, oy = 214; // (0,0) do sistema
  const X = x => ox + x * u, Y = y => oy - y * u;
  let s = '';
  for (let x = -4; x <= 6; x++) s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(7)}" stroke="var(--line)"/>`;
  for (let y = 0; y <= 7; y++) s += `<line x1="${X(-4)}" y1="${Y(y)}" x2="${X(6)}" y2="${Y(y)}" stroke="var(--line)"/>`;
  s += `<line x1="${X(0)}" y1="${Y(2)}" x2="${X(0)}" y2="${Y(4)}" stroke="var(--sign)" stroke-width="5"/>`;
  for (let y = 2.1; y < 4; y += 0.3) s += `<line x1="${X(0) - 3}" y1="${Y(y)}" x2="${X(0) - 10}" y2="${Y(y) + 7}" stroke="var(--sign)" stroke-width="1.4"/>`;
  if (sol){
    s += `<polygon points="${X(0)},${Y(2)} ${X(6)},${Y(4)} ${X(6)},${Y(7)} ${X(3)},${Y(7)} ${X(0)},${Y(4)}" fill="var(--ok)" opacity=".16"/>`;
    s += `<g stroke="var(--ray)" stroke-width="1.6" stroke-dasharray="5 4"><line x1="${X(-3)}" y1="${Y(1)}" x2="${X(6)}" y2="${Y(4)}"/><line x1="${X(-3)}" y1="${Y(1)}" x2="${X(3)}" y2="${Y(7)}"/></g>`;
    s += `<circle cx="${X(-3)}" cy="${Y(1)}" r="5" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="${X(-3)}" y="${Y(1) + 20}" text-anchor="middle" class="pt pt-strong">O'</text>`;
  }
  s += `<circle cx="${X(3)}" cy="${Y(1)}" r="6" fill="var(--ink)"/><text x="${X(3) + 10}" y="${Y(1) + 18}" class="pt pt-strong">O</text>`;
  [['A',1,1],['B',2,4],['C',5,3],['D',3,5],['E',1,6]].forEach(([n, x, y]) => { s += `<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="var(--plot2)" stroke="var(--ink)" stroke-width="1.2"/><text x="${X(x) + 8}" y="${Y(y) - 7}" class="pt pt-strong">${n}</text>`; });
  s += `<text x="${X(0) - 14}" y="${Y(4.3)}" text-anchor="end" class="pt pt-strong">espelho</text>`;
  return fig('0 0 340 230', sol ? 'Solução: a imagem O\' do observador fica 3 quadradinhos atrás do espelho. As retas que saem de O\' e passam pelas bordas do espelho limitam o campo visual, sombreado. Ficam dentro dele apenas os pontos B e D.' : 'Malha quadriculada com um espelho plano vertical de 2 quadradinhos de altura. O observador O está 3 quadradinhos à direita do espelho e 1 quadradinho acima da base da malha, abaixo da borda inferior do espelho. Os pontos, em coordenadas (horizontal, vertical) a partir da base do espelho: A (1, 1), B (2, 4), C (5, 3), D (3, 5) e E (1, 6). O espelho vai da altura 2 à altura 4.', s);
}

/* Q9: côncavo, objeto entre C e F */
function concavo(sol){
  const [d, mk] = seta('var(--plot2)'); const [d2, mk2] = seta('var(--ray)');
  let s = `${d}${d2}<line x1="10" y1="100" x2="322" y2="100" stroke="var(--muted)" stroke-width="1.2"/>
    <path d="M304 18 Q316 100 304 182" fill="none" stroke="var(--sign)" stroke-width="4"/>
    ${[190, 250, 310].map((x, i) => `<circle cx="${x}" cy="100" r="3" fill="var(--ink)"/><text x="${x}" y="${i === 2 ? 92 : 118}" text-anchor="middle" class="pt pt-strong">${['C','F','V'][i]}</text>`).join('')}
    <line x1="220" y1="100" x2="220" y2="72" stroke="var(--plot2)" stroke-width="4" marker-end="${mk}"/><text x="220" y="118" text-anchor="middle" class="pt pt-strong">o</text>`;
  if (sol) s += `<g stroke="var(--ray)" stroke-width="1.8" fill="none"><polyline points="220,70 309,70 130,160"/><polyline points="220,70 309,159 130,160"/></g>
    <line x1="130" y1="100" x2="130" y2="158" stroke="var(--plot2)" stroke-width="4" stroke-dasharray="1 0" marker-end="${mk}"/><text x="122" y="94" text-anchor="middle" class="pt pt-strong">i</text>`;
  return fig('0 0 340 196', sol ? 'Construção: o raio que sai do topo do objeto paralelo ao eixo reflete passando pelo foco F; o raio que passa por F reflete paralelo ao eixo. Eles se cruzam além de C, abaixo do eixo, onde fica o topo da imagem: real, invertida e maior que o objeto.' : 'Espelho esférico côncavo à direita, com vértice V, foco F e centro de curvatura C marcados no eixo principal. Um objeto o está entre C e F.', s);
}

/* Interface horizontal com normal; ângulos em graus a partir da normal */
function interface(o){
  const cx = 170, cy = 92, R = 84, rad = a => a * Math.PI / 180;
  const [d, mk] = seta('var(--ray)');
  const pi = [cx - R * Math.sin(rad(o.a1)), cy - R * Math.cos(rad(o.a1))];
  let s = `${d}<rect x="10" y="${cy}" width="320" height="${184 - cy}" fill="var(--sign)" opacity=".16"/><line x1="10" y1="${cy}" x2="330" y2="${cy}" stroke="var(--sign)" stroke-width="2"/>
    <line x1="${cx}" y1="10" x2="${cx}" y2="178" stroke="var(--muted)" stroke-dasharray="5 4"/><text x="${cx + 4}" y="20" class="pt">normal</text>
    <line x1="${pi[0].toFixed(1)}" y1="${pi[1].toFixed(1)}" x2="${cx}" y2="${cy}" stroke="var(--ray)" stroke-width="2.6" marker-end="${mk}"/>
    <text x="20" y="${cy - 8}" class="pt pt-strong">${o.m1}</text><text x="20" y="${cy + 20}" class="pt pt-strong">${o.m2}</text>`;
  const arc = (a, up, lab) => { const r = 34, sgn = up ? -1 : 1, x2 = cx + (up ? -1 : 1) * r * Math.sin(rad(a)), y2 = cy + sgn * r * Math.cos(rad(a)); return `<path d="M${cx} ${cy + sgn * r} A${r} ${r} 0 0 ${up ? 0 : 0} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="var(--ink)" stroke-width="1.2"/><text x="${(cx + (up ? -1 : 1) * 46 * Math.sin(rad(a / 2))).toFixed(1)}" y="${(cy + sgn * 46 * Math.cos(rad(a / 2)) + 4).toFixed(1)}" text-anchor="middle" class="pt pt-strong">${lab}</text>`; };
  if (o.a2 !== undefined){
    const pr = [cx + R * Math.sin(rad(o.a2)), cy + R * Math.cos(rad(o.a2))];
    s += `<line x1="${cx}" y1="${cy}" x2="${pr[0].toFixed(1)}" y2="${pr[1].toFixed(1)}" stroke="var(--ray)" stroke-width="2.6" marker-end="${mk}"/>`;
    if (o.l2) s += arc(o.a2, false, o.l2);
  }
  if (o.l1) s += arc(o.a1, true, o.l1);
  (o.cand || []).forEach(([a, n]) => { const p = [cx + 78 * Math.sin(rad(a)), cy + 78 * Math.cos(rad(a))]; s += `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${(cx + 90 * Math.sin(rad(a)) + (a === 0 ? 10 : 0)).toFixed(1)}" y="${(cy + 90 * Math.cos(rad(a)) + 4).toFixed(1)}" text-anchor="middle" class="pt pt-strong">${n}</text>`; });
  return fig('0 0 340 196', o.aria, s);
}

  let s = `${d}<rect x="10" y="80" width="320" height="104" fill="var(--sign)" opacity=".18"/><line x1="10" y1="80" x2="330" y2="80" stroke="var(--sign)" stroke-width="2"/>

    ${fish(250, 158, 1, false)}<text x="250" y="182" text-anchor="middle" class="pt pt-strong">peixe</text>`;
  if (sol) s += `<polyline points="244,154 170,80 56,34" fill="none" stroke="var(--ray)" stroke-width="2" marker-end="${mk}"/><line x1="170" y1="80" x2="244" y2="110" stroke="var(--muted)" stroke-dasharray="5 4"/>${fish(250, 112, .9, true)}<text x="280" y="100" class="pt pt-strong">imagem</text>`;

const CONFIG = {

  registro: 'https://script.google.com/macros/s/AKfycbwtYW1meV27vkJky3RvAJzNNnIVvxEltxqfm1A9ZOuUOBr8XbXdplpNL70pEbSPAysx/exec',     // URL do App da Web do Google Apps Script

const $ = id => document.getElementById(id);
const ID_KEY = 'fis2cib-aluno', FILA_KEY = 'fis2cib-fila', DIA_KEY = 'fis2cib-ultimo-acesso';
const getAluno = () => { try { const a = JSON.parse(localStorage.getItem(ID_KEY) || 'null'); return a && a.email ? a : null; } catch(e){ return null; } };
const setAluno = a => { try { if (a) localStorage.setItem(ID_KEY, JSON.stringify(a)); else localStorage.removeItem(ID_KEY); } catch(e){} };
const precisaLogin = () => !!CONFIG.dominio && !getAluno();
function emailValido(e){ const d = CONFIG.dominio.toLowerCase().replace(/^@/, ''); return new RegExp('^[a-z0-9._%+-]+@' + d.replace(/[.]/g, '\\.') + '$').test(e); }
function enviar(ev){
  const a = getAluno(); if (!CONFIG.registro || !a) return;
  const item = Object.assign({ email: a.email, turma: a.turma, quando: new Date().toISOString(), dispositivo: /mobi|android|iphone|ipad/i.test(navigator.userAgent) ? 'celular/tablet' : 'computador' }, ev);
  let fila = []; try { fila = JSON.parse(localStorage.getItem(FILA_KEY) || '[]'); } catch(e){}
  fila.push(item); try { localStorage.setItem(FILA_KEY, JSON.stringify(fila.slice(-60))); } catch(e){}
  enviarFila();
}
let enviando = false;
async function enviarFila(){
  if (!CONFIG.registro || enviando || navigator.onLine === false) return;
  enviando = true;
  try {
    let fila = []; try { fila = JSON.parse(localStorage.getItem(FILA_KEY) || '[]'); } catch(e){}
    while (fila.length){
      await fetch(CONFIG.registro, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(fila[0]) });
      fila.shift(); try { localStorage.setItem(FILA_KEY, JSON.stringify(fila)); } catch(e){}
    }
  } catch(e){} finally { enviando = false; }
}
window.addEventListener('online', enviarFila);
function registrarAcessoDoDia(){
  const a = getAluno(); if (!CONFIG.registro || !a) return;
  const marca = a.email + '|' + new Date().toLocaleDateString('sv-SE');
  let ult = null; try { ult = localStorage.getItem(DIA_KEY); } catch(e){}
  if (ult !== marca){ enviar({ evento: 'acesso' }); try { localStorage.setItem(DIA_KEY, marca); } catch(e){} }
}
/* Tempo ativo: conta só com a lista aberta, a tela visível e o aluno interagindo (pausa após 3 min parado) */
let tMarca = null, tInter = Date.now();
['click','keydown','scroll','touchstart'].forEach(ev => window.addEventListener(ev, () => { if (LI && tMarca === null && document.visibilityState === 'visible') tMarca = Date.now(); tInter = Date.now(); }, { passive: true }));
function contarTempo(){
  if (!LI || !st || tMarca === null) return;
  const fim = Math.min(Date.now(), tInter + 180000);
  if (fim > tMarca) st.tempo = (st.tempo || 0) + (fim - tMarca) / 1000;
  tMarca = Date.now() <= tInter + 180000 ? Date.now() : null;
  store(LI.key, st);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ contarTempo(); tMarca = null; } else if (LI){ tMarca = Date.now(); tInter = Date.now(); } });
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const toTop = () => window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
const load = k => { try { const s = JSON.parse(localStorage.getItem(k) || 'null'); if (s && typeof s === 'object') return Object.assign({ answers:{}, hints:{}, cur:-1 }, s); } catch(e){} return { answers:{}, hints:{}, cur:-1 }; };
const store = (k, s) => { try { localStorage.setItem(k, JSON.stringify(s)); } catch(e){} };

let T = null, LI = null, st = null; // tema, lista e progresso atuais

function stats(l){ const s = load(l.key); let n = 0, c = 0; l.Q.forEach((q,i)=>{ const a = s.answers[i]; if (a !== undefined){ n++; if (a === q.ans) c++; } }); return { n, c, total: l.Q.length }; }

function plate(eyebrow, title, sub){
  $('eyebrow').textContent = eyebrow; $('ptitle').textContent = title; $('psub').textContent = sub;
  const r = document.documentElement;
  SITE.temas.forEach(t => t.cls && r.classList.remove(t.cls));

/* Enfeite do cabeçalho de cada tema */
function decoTema(e){
  if (e === 'onda'){
    let d = 'M0 40'; for (let x = 0; x <= 220; x += 4) d += ` L${x} ${(40 - 14 * Math.sin(2 * Math.PI * x / 55)).toFixed(1)}`;
    return `<svg viewBox="0 0 220 80" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="3"/><path d="${d}" transform="translate(0 22)" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/></svg>`;
  }
  if (e === 'raio'){
    const cores = ['#FF5A4F','#FF9F40','#FFE24D','#55D17A','#4FA3FF','#8B6CFF'];
    return `<svg viewBox="0 0 220 80" aria-hidden="true"><line x1="0" y1="52" x2="104" y2="40" stroke="#FFFFFF" stroke-width="3"/><polygon points="96,70 128,14 160,70" fill="none" stroke="currentColor" stroke-width="2.5"/>${cores.map((c, i) => `<line x1="140" y1="44" x2="220" y2="${30 + i * 8}" stroke="${c}" stroke-width="2.5"/>`).join('')}</svg>`;
  }
  return '';
}
/* Trilha de progresso: estrada (carro), onda (corda) ou raio de luz */
function trilha(n){
  const e = (T && T.estilo) || 'estrada';
  if (e === 'onda'){
    let d = 'M0 15'; for (let x = 0; x <= 1000; x += 4) d += ` L${x} ${(15 - 10 * Math.sin(2 * Math.PI * x * n / 1000)).toFixed(2)}`;
    return `<div class="lane2 ln-onda" id="lane" data-estilo="onda">
      <svg class="ln-base" viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="15" x2="1000" y2="15"/></svg>
      <svg class="ln-fill" viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true"><path d="${d}"/></svg>
      <span class="ln-src" aria-hidden="true"></span><span class="ln-head" aria-hidden="true"></span></div>`;
  }
  if (e === 'raio'){
    return `<div class="lane2 ln-raio" id="lane" data-estilo="raio">
      <svg class="ln-base" viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="15" x2="1000" y2="15"/></svg>
      <svg class="ln-fill" viewBox="0 0 1000 30" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="15" x2="1000" y2="15"/></svg>
      <span class="ln-src" aria-hidden="true"></span><span class="ln-head" aria-hidden="true"></span></div>`;
  }
  return `<div class="lane" id="lane" data-estilo="estrada">
        <svg class="car" id="car" viewBox="0 0 34 20" aria-hidden="true">
          <path d="M3 13 L5 8 Q6 6 9 6 L21 6 Q23 6 25 8 L29 11 Q32 11.5 32 14 L32 15 L2 15 L2 14 Q2 13 3 13 Z" fill="var(--lane)"/>
          <path d="M8 8 L12 8 L12 11 L6.5 11 Z M14 8 L20 8 Q21.5 8 23 9.5 L24.5 11 L14 11 Z" fill="var(--road)"/>
          <circle cx="9" cy="15.5" r="3" fill="var(--road-ink)"/><circle cx="25" cy="15.5" r="3" fill="var(--road-ink)"/>
        </svg>
      </div>`;
}
function crumbs(items){
  const c = $('crumbs');
  if (!items){ c.hidden = true; c.innerHTML = ''; return; }
  c.hidden = false;
  c.innerHTML = items.map((it, i) => {
    const last = i === items.length - 1;
    return (i ? '<span class="sep">›</span>' : '') + (last ? `<span class="here">${it.label}</span>` : `<button data-nav="${it.nav}">${it.label}</button>`);
  }).join('');
}

const lvKey = n => ({'básico':'b','intermediário':'i','avançado':'a'})[n] || 'b';
function levelGroups(){
  const g = [];
  LI.Q.forEach((q, i) => { if (!q.nivel) return; const last = g[g.length-1]; if (last && last.n === q.nivel && last.end === i) last.end = i + 1; else g.push({ n: q.nivel, start: i, end: i + 1 }); });
  return g;
}
function levelRow(){
  const g = levelGroups(); if (!g.length) return '';
  return `<div class="lvrow" style="grid-template-columns:repeat(${LI.Q.length},1fr)">${g.map(x => `<span class="lv-${lvKey(x.n)}" style="grid-column:${x.start+1} / ${x.end+1}">${x.n}</span>`).join('')}</div>`;
}
function levelSummary(){
  const g = levelGroups(); if (!g.length) return '';
  const c = {}; g.forEach(x => c[x.n] = (c[x.n] || 0) + (x.end - x.start));
  return `<div class="row" style="gap:6px">${Object.keys(c).map(n => `<span class="lvl lvl-${lvKey(n)}">${c[n]} ${n === 'básico' ? (c[n]>1?'básicas':'básica') : n === 'intermediário' ? (c[n]>1?'intermediárias':'intermediária') : (c[n]>1?'avançadas':'avançada')}</span>`).join('')}</div>`;
}
const save = () => store(LI.key, st);
function resumoLista(){
  const porNivel = n => { const idx = LI.Q.map((q,i) => i).filter(i => LI.Q[i].nivel === n); return idx.length ? idx.filter(i => status(i) === 'ok').length + '/' + idx.length : ''; };
  return {
    evento: 'lista concluída', tema: T.nome, lista: 'Lista ' + LI.num,
    acertos: correctCount(), total: LI.Q.length,
    basico: porNivel('básico'), intermediario: porNivel('intermediário'), avancado: porNivel('avançado'),
    erradas: LI.Q.map((q,i) => i).filter(i => status(i) !== 'ok').map(i => i + 1).join(', '),
    dicas: Object.keys(st.hints || {}).filter(k => st.hints[k]).length,
    tempoMin: Math.round((st.tempo || 0) / 6) / 10
  };
}
function status(i){ const a = st.answers[i]; if (a === undefined) return 'none'; return a === LI.Q[i].ans ? 'ok' : 'bad'; }
function correctCount(){ return LI.Q.reduce((n,_,i)=> n + (status(i)==='ok'?1:0), 0); }
function answeredCount(){ return LI.Q.reduce((n,_,i)=> n + (status(i)!=='none'?1:0), 0); }

function renderRoad(){
  const Q = LI.Q;
  $('marks').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    const cls = ['mk', s==='ok'?'ok':s==='bad'?'bad':'', st.cur===i?'cur':''].join(' ');
    const lab = s==='ok'?'certa':s==='bad'?'errada':'não respondida';
    return `<button class="${cls}" data-go="${i}" aria-label="Questão ${i+1}, ${lab}">${i+1}</button>`;
  }).join('');
  const pos = st.cur < 0 ? 0 : st.cur >= Q.length ? Q.length - 0.5 : st.cur + 0.5;
  const lane = $('lane'), pct = (pos/Q.length)*100;
  if (lane.dataset.estilo === 'estrada') $('car').style.left = `calc(${pct}% + ${st.cur<0?17:0}px)`;
  else { lane.style.setProperty('--p', pct.toFixed(2)); lane.querySelector('.ln-fill').style.clipPath = `inset(0 ${(100 - pct).toFixed(2)}% 0 0)`; }
  const n = answeredCount();
  $('roadLabel').textContent = st.cur>=0 && st.cur<Q.length ? `Questão ${st.cur+1} de ${Q.length}` : `Percurso: ${Q.length} questões`;
  $('roadScore').textContent = n ? `${correctCount()} de ${n} certas` : '';
}

function renderIntro(){
  const Q = LI.Q, n = answeredCount();
  $('qa').innerHTML = `
  <section class="card intro">
    <div class="qnum">Antes de começar</div>
    <p>São <b>${Q.length} questões</b> sobre ${LI.titulo.toLowerCase()}. ${LI.intro || ''}</p>${levelSummary()}
    <ul>
      <li>Responda uma questão por vez. Logo depois, aparece a <b>resolução detalhada</b>, passo a passo.</li>
      <li>Travou? Use o botão <b>Ver dica</b> antes de responder.</li>
      <li>A <b>caixa de ferramentas</b> acima tem as fórmulas e conversões que você vai usar.</li>
      <li>Tenha papel e lápis à mão e tente resolver antes de clicar na alternativa.</li>
    </ul>
    <div class="row">
      <button class="btn primary" id="startBtn">${n && n < Q.length ? 'Continuar de onde parei' : n === Q.length ? 'Ver meu resultado' : 'Começar a questão 1'}</button>
      ${n ? `<span class="small">${n} de ${Q.length} questões respondidas neste aparelho.</span>` : ''}
    </div>
  </section>`;
  $('startBtn').onclick = () => {
    if (n === Q.length) goQ(Q.length);
    else { const next = Q.findIndex((_,i)=>status(i)==='none'); goQ(next < 0 ? 0 : next); }
  };
}

function renderQuestion(i){
  const Q = LI.Q, q = Q[i], a = st.answers[i], done = a !== undefined, skipped = a === -1;
  const opts = q.opts.map((o,k)=>{
    let cls = 'opt', tag = '';
    if (done){
      if (k === q.ans){ cls += ' is-correct'; tag = '<span class="tag">✓ correta</span>'; }
      else if (k === a){ cls += ' is-wrong'; tag = '<span class="tag">✗ sua resposta</span>'; }
      else cls += ' is-dim';
    }
    return `<li><button class="${cls}" data-pick="${k}" ${done?'disabled':''}><span class="letter">${L[k]}</span><span>${o}</span>${tag}</button></li>`;
  }).join('');
  let fb = '';
  if (done){
    fb = a === q.ans
      ? `<div class="feedback good" role="status"><span class="ico">✓</span>Correto! Confira a resolução para ver se o seu raciocínio bate.</div>`
      : skipped
        ? `<div class="feedback bad" role="status"><span class="ico">→</span>Sem problema. Acompanhe a resolução com calma e tente refazer no papel.</div>`
        : `<div class="feedback bad" role="status"><span class="ico">✗</span>Não foi dessa vez. A resposta certa é a ${L[q.ans]}. Veja onde o raciocínio muda.</div>`;
  }
  const sol = done ? `
    <section class="sol" aria-label="Resolução detalhada">
      <h3>Resolução detalhada</h3>
      <ol class="steps">
        ${q.steps.map(([lab,html])=>`<li class="step"><div class="step-body"><div class="step-label">${lab}</div>${html}</div></li>`).join('')}
      </ol>
      <div class="answer"><span class="letter">${L[q.ans]}</span><span>Resposta: alternativa ${L[q.ans]} (${q.opts[q.ans]})</span></div>
      ${q.alt ? `<div class="alt"><b class="lbl">Outro jeito de pensar</b>${q.alt}</div>` : ''}
      ${q.warn ? `<div class="warn"><b class="lbl">Cuidado com a pegadinha</b>${q.warn}</div>` : ''}
    </section>` : '';
  const showHint = st.hints[i] && !done;
  const last = i === Q.length - 1;
  $('qa').innerHTML = `
  <article class="card">
    <div class="qhead">
      <div class="qnum">Questão ${i+1} <span>/ ${Q.length}</span></div>
      <span class="row" style="gap:6px">${q.nivel ? `<span class="lvl lvl-${lvKey(q.nivel)}">Nível ${q.nivel}</span>` : ''}<span class="src">${q.src}</span></span>
    </div>
    <div class="stmt">${q.text}</div>
    <ul class="opts">${opts}</ul>
    ${!done ? `<div class="row">
        ${showHint ? '' : `<button class="btn" id="hintBtn">Ver dica</button>`}
        <span class="spacer"></span>
        <button class="btn ghost" id="skipBtn">Não sei, mostrar a resolução</button>
      </div>` : ''}
    ${showHint ? `<div class="tip"><b>Dica</b>${q.hint}</div>` : ''}
    ${fb}
    ${sol}
    <div class="row">
      ${i > 0 ? `<button class="btn" id="prevBtn">← Anterior</button>` : ''}
      <span class="spacer"></span>
      ${done ? `<button class="btn primary" id="nextBtn">${last ? 'Ver meu resultado' : 'Próxima questão →'}</button>`
             : (!last ? `<button class="btn ghost" id="jumpBtn">Pular por enquanto</button>` : '')}
    </div>
  </article>`;
  $('qa').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => answer(i, +b.dataset.pick));
  const h = $('hintBtn'); if (h) h.onclick = () => { st.hints[i] = true; save(); renderQuestion(i); };
  const s = $('skipBtn'); if (s) s.onclick = () => answer(i, -1);
  const p = $('prevBtn'); if (p) p.onclick = () => goQ(i - 1);
  const n = $('nextBtn'); if (n) n.onclick = () => goQ(i + 1);
  const j = $('jumpBtn'); if (j) j.onclick = () => goQ(i + 1);
}

function answer(i, k){
  if (st.answers[i] !== undefined) return;
  st.answers[i] = k; save();
  if (answeredCount() === LI.Q.length && !st.enviado){ contarTempo(); st.enviado = true; save(); enviar(resumoLista()); }
  renderRoad(); renderQuestion(i);
  const fb = $('qa').querySelector('.feedback');
  if (fb) fb.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

function renderEnd(){
  const Q = LI.Q, c = correctCount(), n = answeredCount();
  const msg = n < Q.length
    ? `Você ainda tem ${Q.length - n} questão(ões) sem responder. Toque nelas abaixo para terminar.`
    : c >= Math.ceil(Q.length * 0.9) ? 'Excelente! Você domina este conteúdo. Releia as pegadinhas para chegar à somativa ainda mais seguro.'
    : c >= Math.ceil(Q.length * 0.6) ? 'Bom trabalho. Revise as questões que errou e leia com atenção as pegadinhas: é onde mais se perde ponto.'
    : 'Vale revisar a caixa de ferramentas e refazer as questões com calma, acompanhando cada passo da resolução, antes da somativa.';
  $('qa').innerHTML = `
  <section class="card">
    <div class="qnum">Resultado</div>
    <div class="score">${c}<span> / ${Q.length}</span></div>
    <p style="margin:0">${msg}</p>
    <ul class="reslist">
      ${Q.map((q,i)=>{ const s = status(i); const t = s==='ok'?'✓ certa':s==='bad'?(st.answers[i]===-1?'→ vista':'✗ errada'):'— pendente';
        return `<li><button class="res ${s}" data-go="${i}"><b>Questão ${i+1}</b><span class="st">${t}</span></button></li>`; }).join('')}
    </ul>
    <div class="row">
      <button class="btn" id="resetBtn">Refazer a lista do zero</button>
      <button class="btn primary" data-nav="tema">Voltar para ${T.nome}</button>
      <span class="small" id="resetNote"></span>
    </div>
  </section>`;
  const r = $('resetBtn'); let armed = false;
  r.onclick = () => {
    if (!armed){ armed = true; r.textContent = 'Confirmar: apagar minhas respostas'; $('resetNote').textContent = 'Toque de novo para confirmar.'; return; }
    st = { answers:{}, hints:{}, cur:-1, tempo:0 }; save(); goQ(-1);
  };
}

function goQ(i){
  st.cur = i; save();
  renderRoad();
  if (i < 0) renderIntro();
  else if (i >= LI.Q.length) renderEnd();
  else renderQuestion(i);
  toTop();
}

/* ===== Navegação com endereço próprio (#/tema/lista) e botão Voltar do celular ===== */
function go(h){ if (location.hash === h) route(); else location.hash = h; }
function openLogin(){
  contarTempo(); tMarca = null; T = LI = null;
  plate(`Física · ${SITE.escola}`, SITE.turma, `${SITE.turmas} · ${SITE.prof}`);
  crumbs(null);
  $('view').innerHTML = `
    <form class="card intro" id="loginForm" novalidate>
      <p class="sect-label">Identificação</p>
      <p>Para usar as listas, informe o seu <b>e-mail do colégio</b> e a sua turma. Você só faz isso uma vez neste aparelho.</p>
      <label class="fld"><span>E-mail do colégio <small class="fld-dica">(só a parte antes do @)</small></span>
        <span class="emailbox">
          <input id="loginEmail" type="text" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="nome.sobrenome" required>
          <span class="dom" aria-hidden="true">@${CONFIG.dominio.replace('.', '.<wbr>')}</span>
        </span></label>
      <label class="fld"><span>Turma</span>
        <select id="loginTurma" required><option value="">Escolha</option>${CONFIG.turmas.map(t => `<option value="${t}">${t}</option>`).join('')}</select></label>
      <p class="small" id="loginErro" role="alert"></p>
      <div class="row"><button class="btn primary" type="submit">Entrar</button></div>
      <p class="note">O professor recebe o seu e-mail, a turma, a data de acesso e os resultados das listas (acertos, tempo e dicas usadas), só para acompanhar os estudos da turma.</p>
    </form>`;
  $('loginForm').onsubmit = e => {
    e.preventDefault();
    let usuario = $('loginEmail').value.trim().toLowerCase().replace(/\s+/g, '');
    const dom = '@' + CONFIG.dominio.toLowerCase().replace(/^@/, '');
    if (usuario.endsWith(dom)) usuario = usuario.slice(0, -dom.length);   // se digitou o e-mail inteiro, aproveita
    const email = usuario + dom, turma = $('loginTurma').value;
    if (!usuario){ $('loginErro').textContent = 'Escreva a parte do seu e-mail antes do @.'; $('loginEmail').focus(); return; }
    if (usuario.includes('@') || !emailValido(email)){ $('loginErro').textContent = `Escreva só a parte antes do @. O resto (${dom}) já está preenchido.`; $('loginEmail').focus(); return; }
    if (!turma){ $('loginErro').textContent = 'Escolha a sua turma.'; $('loginTurma').focus(); return; }
    setAluno({ email, turma }); registrarAcessoDoDia(); route();
  };
  toTop();
}
function route(){
  if (precisaLogin()){ openLogin(); return; }
  registrarAcessoDoDia(); enviarFila();
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const ti = SITE.temas.findIndex(t => t.id === p[0]);
  if (ti < 0){ openHome(); return; }
  if (!p[1]){ openTema(ti); return; }
  const li = SITE.temas[ti].listas.findIndex(l => l.id === p[1]);
  if (li < 0){ openTema(ti); return; }
  T = SITE.temas[ti]; openLista(li);
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const act = e.target.closest('[data-act="sair"]'); if (act){ setAluno(null); try { localStorage.removeItem(DIA_KEY); } catch(err){} go('#/'); route(); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav){ go(nav.dataset.nav === 'tema' && T ? '#/' + T.id : '#/'); return; }
  const t = e.target.closest('[data-tema]'); if (t){ go('#/' + SITE.temas[+t.dataset.tema].id); return; }
  const l = e.target.closest('[data-lista]'); if (l){ go('#/' + T.id + '/' + T.listas[+l.dataset.lista].id); return; }
  const g = e.target.closest('[data-go]'); if (g && LI){ goQ(+g.dataset.go); }
});

/* ===== Instalação como aplicativo ===== */
let installEvt = null;
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener('appinstalled', () => { installEvt = null; const c = $('installCard'); if (c) c.hidden = true; });
function showInstall(){
  const c = $('installCard'); if (!c || standalone()) return;
  if (installEvt){
    c.hidden = false;
    c.innerHTML = `<p class="sect-label">Instale no celular</p><p>Tenha as listas como um aplicativo: ícone na tela inicial e funcionando mesmo sem internet.</p><div class="row"><button class="btn primary" id="instBtn">Instalar o app</button></div>`;
    $('instBtn').onclick = async () => { installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; c.hidden = true; };
  } else if (isIOS){
    c.hidden = false;
    c.innerHTML = `<p class="sect-label">Instale no iPhone</p><p>No Safari, toque em <b>Compartilhar</b> (o quadrado com a seta para cima) e depois em <b>Adicionar à Tela de Início</b>.</p>`;
  }
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
route();
</script>
